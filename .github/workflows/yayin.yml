# yayin.yml — Windows kurulum paketini BULUTTA derler
# Palet Zaman Asistanı · GPL-3.0
# ══════════════════════════════════════════════════════════════
# Neden bulut: Windows kurulum paketi için Rust + MSVC gerekir
# (~4-7 GB). GitHub'ın windows-latest makinesinde ikisi de HAZIR
# gelir. Böylece geliştirici makinesine hiçbir araç kurulmaz;
# son kullanıcı yalnızca çıkan kurulum dosyasını indirir.
#
# İki tetik:
#   • Elle  → Actions sekmesi → "Yayın" → Run workflow
#             Derler, dosyaları workflow çıktısına koyar (sürüm açmaz).
#   • Etiket → `git tag v1.0.0 && git push origin v1.0.0`
#             Derler + GitHub sürümünü YAYIMLAR (taslak değil).
#
# Neden TASLAK DEĞİL: uygulamanın güncelleme denetimi
# `releases/latest/download/latest.json` adresini okur. Taslak sürüm
# bu adresten GÖRÜNMEZ; kullanıcı "yeni sürüm var" uyarısını almaz
# (2026-10-19 bildirimi). Testler derlemeden ÖNCE koştuğu için
# doğrudan yayımlamak güvenlidir.
# ══════════════════════════════════════════════════════════════
name: Yayın

on:
  push:
    branches: [main]      # main'e her push: DERLE + TEST (sürüm AÇMAZ) →
                          # "iş hiç çalışmadı" yanılgısını ve kırık kodu erken yakalar
    tags: ['v*']          # etiket push'u: DERLE + TASLAK GitHub sürümü açar
  workflow_dispatch:

# Aynı ref üst üste tetiklenirse eskisini iptal et — çift derleme/sürüm olmasın.
concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derle:
    runs-on: windows-latest
    permissions:
      contents: write          # sürüm oluşturmak için

    steps:
      - name: Kaynağı al
        uses: actions/checkout@v7

      - name: Node kur
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Rust kur (runner'da hazır gelir)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust derleme önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: npm bağımlılıkları
        run: npm ci

      - name: Kod bekçisi (9 statik kontrol)
        run: npm run dogrula

      # Derlemeden ÖNCE: kırık bir arayüzün kurulum paketi üretilmesin.
      - name: Davranış testleri (notlar + ses + kilit + panel yönü + takvim)
        run: npm run test

      - name: İkonları üret (assets/logo.png → src-tauri/icons)
        run: npm run icon

      - name: Derle ve yayınla
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v1.11.0 — otomatik güncelleme imzası (tauri-action bunları
          # kullanarak .sig + latest.json üretir; yoksa güncelleme çalışmaz)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Etiketle tetiklendiyse sürüm aç; elle tetiklendiyse yalnız derle
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'Palet Zaman Asistanı ${{ github.ref_name }}'
          releaseBody: |
            Windows 10/11 için kurulum paketi.

            **Kurulum:** aşağıdaki `...-setup.exe` dosyasını indirip çalıştırın.
            Yönetici izni gerekmez (kullanıcı bazlı kurulum). Ek bağımlılık yok —
            WebView2 Windows 10/11'de hazır gelir.

            İmzasız derleme olduğu için Windows ilk açılışta "Windows korumalı
            bilgisayarınızı korudu" uyarısı gösterebilir:
            **Ek bilgi → Yine de çalıştır**.
          releaseDraft: false         # doğrudan yayımla: güncelleme denetimi
                                      # taslak sürümü GÖRMEZ (latest.json)
          prerelease: false

      # Kemeri sıkı bağla: sürüm gerçekten "en son" olsun. Uygulamanın
      # güncelleme denetimi `/releases/latest/download/latest.json` okur.
      - name: Sürümü "en son" olarak işaretle
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

      - name: Kurulum dosyalarını sakla (elle tetiklemede indirilebilsin)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-kurulum
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
