[package]
name = "palet-zaman-asistani"
version = "1.5.0"
description = "Palet Zaman Asistanı — masaüstü flip clock + notlar + hava durumu"
authors = ["Paletweb Bilişim"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"        # boyut önceliği — kurulum paketi küçük kalsın
panic = "abort"
strip = true
